```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Math Score Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        select,
        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #667eea;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        button {
            grid-column: 1 / 3;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5568d9;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5ff;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            color: #333;
            margin-bottom: 8px;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        @media (max-width: 650px) {
            form {
                grid-template-columns: 1fr;
            }

            .full-width,
            button {
                grid-column: 1;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Math Score Prediction</h1>

    <p class="subtitle">
        Enter the student's details to predict the mathematics score.
    </p>

    <form action="{{ url_for('predict_datapoint') }}" method="POST">

        <div class="form-group">
            <label for="gender">Gender</label>
            <select name="gender" id="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>

        <div class="form-group">
            <label for="race_ethnicity">Race / Ethnicity</label>
            <select name="race_ethnicity" id="race_ethnicity" required>
                <option value="">Select Group</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>
        </div>

        <div class="form-group">
            <label for="parental_level_of_education">
                Parental Level of Education
            </label>

            <select name="parental_level_of_education"
                    id="parental_level_of_education"
                    required>

                <option value="">Select Education</option>
                <option value="some high school">Some High School</option>
                <option value="high school">High School</option>
                <option value="some college">Some College</option>
                <option value="associate's degree">Associate's Degree</option>
                <option value="bachelor's degree">Bachelor's Degree</option>
                <option value="master's degree">Master's Degree</option>

            </select>
        </div>

        <div class="form-group">
            <label for="lunch">Lunch</label>

            <select name="lunch" id="lunch" required>
                <option value="">Select Lunch Type</option>
                <option value="standard">Standard</option>
                <option value="free/reduced">Free / Reduced</option>
            </select>
        </div>

        <div class="form-group">
            <label for="test_preparation_course">
                Test Preparation Course
            </label>

            <select name="test_preparation_course"
                    id="test_preparation_course"
                    required>

                <option value="">Select Course</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>

            </select>
        </div>

        <div class="form-group">
            <label for="reading_score">Reading Score</label>

            <input
                type="number"
                name="reading_score"
                id="reading_score"
                min="0"
                max="100"
                placeholder="Enter reading score"
                required>
        </div>

        <div class="form-group">
            <label for="writing_score">Writing Score</label>

            <input
                type="number"
                name="writing_score"
                id="writing_score"
                min="0"
                max="100"
                placeholder="Enter writing score"
                required>
        </div>

        <button type="submit">
            Predict Math Score
        </button>

    </form>

    {% if results is defined %}
    <div class="result">
        <h2>Predicted Math Score</h2>

        <div class="score">
            {{ results }}
        </div>
    </div>
    {% endif %}

</div>

</body>
</html>
```
